# Continuous integration and image publishing (IaC Phase 4, groupscout-site-6ah.5).
#
#   test   npm test in the same Node image the Dockerfile uses
#   image  build the production target, start it and check /healthz, then
#          fail on fixable critical vulnerabilities. On main it pushes
#          ghcr.io/alvindcastro/groupscout-ui:<full sha> and the moving :main
#          tag, so every main commit has an image.
#
# Branch protection on main requires these jobs. Third-party actions are pinned
# to commit SHAs, and downloaded tools are checksum-verified; Renovate proposes
# the action and image updates (renovate.json). Bump GRYPE_VERSION and its
# checksum by hand from the release's checksums file.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Same base image as the Dockerfile.
    container: node:22.23.3-trixie-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests
        run: npm test

  image:
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      UI_IMAGE: ghcr.io/alvindcastro/groupscout-ui
      UI_IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The source label links the GHCR package to this repository.
      - name: Build the production target
        run: |
          docker build --pull --target production \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="$UI_IMAGE_TAG" \
            -t "$UI_IMAGE:$UI_IMAGE_TAG" .

      - name: Start it and check /healthz
        run: |
          docker run -d --name groupscout-ui -p 127.0.0.1:3000:3000 "$UI_IMAGE:$UI_IMAGE_TAG"
          status=starting
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' groupscout-ui)
            [ "$status" = starting ] || break
            sleep 2
          done
          docker logs groupscout-ui
          if [ "$status" != healthy ]; then
            echo "container health: $status"
            exit 1
          fi
          curl -fsS http://127.0.0.1:3000/healthz
          [ "$(docker inspect -f '{{.Config.User}}' groupscout-ui)" = node ]
          docker rm -f groupscout-ui

      - name: Install grype
        env:
          GRYPE_VERSION: 0.119.0
          GRYPE_SHA256: 3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo grype.tar.gz "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  grype.tar.gz" | sha256sum -c -
          tar -xzf grype.tar.gz grype
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Lists every finding that has a fix; fails only on fixable criticals.
      - name: Vulnerability scan
        run: grype "docker:$UI_IMAGE:$UI_IMAGE_TAG" --only-fixed --fail-on critical

      - name: Push to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'alvindcastro/groupscout-ui'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$UI_IMAGE:$UI_IMAGE_TAG" "$UI_IMAGE:main"
          docker push "$UI_IMAGE:$UI_IMAGE_TAG"
          docker push "$UI_IMAGE:main"
          docker logout ghcr.io
