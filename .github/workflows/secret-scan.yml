# Secret scanning (IaC Phase 4, groupscout-site-6ah.5; the backend has had the
# same job since Phase 3). gitleaks scans the full git history; reviewed false
# positives live in .gitleaksignore. Findings are redacted because the
# repository and its Actions logs are public. GitHub secret scanning and push
# protection are also on.
name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan history
        run: gitleaks git --redact --no-banner --exit-code 1 .

      # Plaintext env files and private keys must never be tracked.
      - name: No tracked secret files
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env(\.[^/]*)?$|\.(pem|key|p12|pfx)$' || true)
          if [ -n "$tracked" ]; then
            echo "Plaintext secret files are tracked:"
            echo "$tracked"
            exit 1
          fi
